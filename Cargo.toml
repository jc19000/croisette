[package]
name = "croisette"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Proof of concept: an MQTT 3.1.1 broker on the cannes thread-per-core actor engine, with io_uring"
license = "Apache-2.0"
repository = "https://github.com/jc19000/croisette"
publish = false

[dependencies]
# Switch to the crates.io release once cannes 0.2.0 is published.
cannes = { version = "0.2", git = "https://github.com/jc19000/cannes", branch = "main", features = ["io-uring"] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
