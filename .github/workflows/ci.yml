name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest # 4 vCPUs: the tests pin the broker to cores 1 and 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --release
      - run: cargo test --release
      - run: sudo apt-get update && sudo apt-get install -y mosquitto-clients
      - run: tests/interop.sh

  iceberg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --features iceberg
      - run: cargo test --features iceberg --test archive --lib
