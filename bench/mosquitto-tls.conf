# Mosquitto with a TLS listener, for bench/compare.sh (tls block). Run as root so that it can read
# the test key.
user root
listener 18833 127.0.0.1
certfile tests/data/cert.pem
keyfile tests/data/key.pem
allow_anonymous true
set_tcp_nodelay true
max_queued_messages 1000000
max_inflight_messages 0
log_dest none
